<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>JS Animation</title>
        <link rel="stylesheet" href="/src/styles/main.css" />
    </head>
    <body class="bg-stage font-sans">
        <section
            class="sidebar fixed top-0 left-0 flex h-dvh w-55 items-center justify-center bg-sidebar motion-safe:transition-transform motion-safe:duration-500 motion-safe:ease-in-out [&.hide]:-translate-x-full">
            <ul class="flex list-none flex-col gap-3.5">
                <li>
                    <a
                        href="#"
                        class="text-[1.2rem] text-white no-underline transition-colors duration-200 hover:text-accent">
                        Home
                    </a>
                </li>
                <li>
                    <a
                        href="#"
                        class="text-[1.2rem] text-white no-underline transition-colors duration-200 hover:text-accent">
                        About
                    </a>
                </li>
                <li>
                    <a
                        href="#"
                        class="text-[1.2rem] text-white no-underline transition-colors duration-200 hover:text-accent">
                        Projects
                    </a>
                </li>
                <li>
                    <a
                        href="#"
                        class="text-[1.2rem] text-white no-underline transition-colors duration-200 hover:text-accent">
                        Contact
                    </a>
                </li>
            </ul>
        </section>

        <div class="flex min-h-dvh items-center justify-center">
            <button
                type="button"
                class="cursor-pointer rounded-md bg-accent px-6 py-3 text-base font-semibold text-stage transition-colors hover:bg-accent-hover">
                Toggle Sidebar
            </button>
        </div>

        <script type="module" src="./app.js"></script>
    </body>
</html>

<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Controlling Tweens</title>
        <link rel="stylesheet" href="/src/styles/main.css" />
    </head>
    <body class="flex min-h-dvh items-center justify-center bg-[#1b1b1b] font-sans">
        <section class="flex flex-col items-center">
            <div class="mb-8 flex h-60 items-center justify-center">
                <div class="box box1 size-15 rounded-full bg-[#ffa31a]"></div>
            </div>

            <section class="buttons-container flex flex-wrap justify-center gap-3">
                <button
                    type="button"
                    class="play cursor-pointer rounded-md bg-[#f5f5f5] px-5 py-2.5 text-[0.95rem] font-semibold text-[#1b1b1b] transition-colors hover:bg-[#ffa31a]">
                    Play
                </button>
                <button
                    type="button"
                    class="pause cursor-pointer rounded-md bg-[#f5f5f5] px-5 py-2.5 text-[0.95rem] font-semibold text-[#1b1b1b] transition-colors hover:bg-[#ffa31a]">
                    Pause
                </button>
                <button
                    type="button"
                    class="reverse cursor-pointer rounded-md bg-[#f5f5f5] px-5 py-2.5 text-[0.95rem] font-semibold text-[#1b1b1b] transition-colors hover:bg-[#ffa31a]">
                    Reverse
                </button>
                <button
                    type="button"
                    class="restart cursor-pointer rounded-md bg-[#f5f5f5] px-5 py-2.5 text-[0.95rem] font-semibold text-[#1b1b1b] transition-colors hover:bg-[#ffa31a]">
                    Restart
                </button>
            </section>
        </section>

        <script type="module" src="./app.js"></script>
    </body>
</html>
